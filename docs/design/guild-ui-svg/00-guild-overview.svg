<svg width='1280' height='1280' viewBox='0 0 1280 1280' fill='none' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <style>
      .h1{font:600 28px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#0F172A}.h2{font:600 18px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#0F172A}.h3{font:600 14px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#0F172A}.muted{font:400 13px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#6B7280}.caption{font:400 12px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#6B7280}.label{font:500 12px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#6B7280}.value{font:600 22px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#111827}.btn{font:500 13px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif}.small{font:500 12px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif;fill:#0F172A}.card{fill:#FFFFFF;stroke:#E5E7EB}.soft{fill:#F5F6F8;stroke:#E5E7EB}.dark{fill:#0F172A}.line{stroke:#E5E7EB;stroke-width:1}.ok{fill:#16A34A}.warn{fill:#B45309}.danger{fill:#B91C1C}.blue{fill:#2563EB}
    </style>
    <marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 Z' fill='#94A3B8'/></marker>
  </defs>
  <rect width='1280' height='1280' fill='#FAFAFA'/>

  <text x='32' y='56' class='h1'>江湖总览</text>
  <text x='32' y='84' class='muted'>查看义仓、悬赏、门派、人口与晨钟暮鼓状态。</text>
