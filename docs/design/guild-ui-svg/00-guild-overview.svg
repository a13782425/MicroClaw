  <circle cx='64' cy='1014' r='5' class='blue'/><text x='84' y='1019' class='h3'>青岚门晋升为铜品，编制上限提升至 8 人</text><text x='1040' y='1019' class='caption'>18 分钟前</text>
  <circle cx='64' cy='1052' r='5' class='warn'/><text x='84' y='1057' class='h3'>长约「每日销售汇总」预算低于水位线，已发信报提醒</text><text x='1040' y='1057' class='caption'>46 分钟前</text>
