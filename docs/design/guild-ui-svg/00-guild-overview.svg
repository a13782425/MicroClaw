    <text x='0' y='52' class='label'>执行中</text><rect x='88' y='42' width='220' height='8' rx='4' fill='#F1F1F2'/><rect x='88' y='42' width='140' height='8' rx='4' fill='#2563EB'/><text x='320' y='50' class='caption'>14</text>
    <text x='0' y='88' class='label'>等依赖</text><rect x='88' y='78' width='220' height='8' rx='4' fill='#F1F1F2'/><rect x='88' y='78' width='58' height='8' rx='4' fill='#B45309'/><text x='320' y='86' class='caption'>5</text>
    <text x='0' y='124' class='label'>待验收</text><rect x='88' y='114' width='220' height='8' rx='4' fill='#F1F1F2'/><rect x='88' y='114' width='90' height='8' rx='4' fill='#16A34A'/><text x='320' y='122' class='caption'>6</text>
    <text x='0' y='160' class='label'>无人接</text><rect x='88' y='150' width='220' height='8' rx='4' fill='#F1F1F2'/><rect x='88' y='150' width='38' height='8' rx='4' fill='#B91C1C'/><text x='320' y='158' class='caption'>3</text>
  </g>

